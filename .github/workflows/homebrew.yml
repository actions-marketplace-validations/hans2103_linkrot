name: Homebrew tap

# Writes Formula/linkrot.rb in hans2103/homebrew-tap for a release and pushes it.
# Called by the release workflow; run it by hand (Actions > Homebrew tap > Run workflow)
# with "dry run" on to check that HOMEBREW_TAP_TOKEN can still push, without changing the tap.

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Release tag, e.g. v0.2.0 (empty = latest release)
        type: string
        required: false
      dry_run:
        description: Dry run (check the token, push nothing)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  tap:
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
      - name: Check tap token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::error::Secret HOMEBREW_TAP_TOKEN is not set; update hans2103/homebrew-tap by hand (see RELEASING.md)."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: hans2103/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Write formula
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version }}
        run: |
          tag=${TAG:-$(gh release view --json tagName --jq .tagName)}
          echo "TAG=$tag" >> "$GITHUB_ENV"
          gh release download "$tag" --pattern checksums.txt --dir "$RUNNER_TEMP"
          .github/scripts/homebrew-formula.sh "${tag#v}" "$RUNNER_TEMP/checksums.txt" > tap/Formula/linkrot.rb
          ruby -c tap/Formula/linkrot.rb
          git -C tap diff
      - name: Push to tap
        run: |
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          changed=false
          if git diff --quiet; then
            echo "Formula already at ${TAG#v}."
          else
            git commit -qam "linkrot ${TAG#v}"
            changed=true
          fi
          if [ "$DRY_RUN" = true ]; then
            # Contacts GitHub as a real push does, so a token without write access fails here.
            git push --dry-run origin HEAD
            echo "Dry run: the token can push to hans2103/homebrew-tap. Nothing was pushed."
          elif [ "$changed" = true ]; then
            git push origin HEAD
          fi
